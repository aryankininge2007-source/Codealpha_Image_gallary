<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="buttons">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('car')">Cars</button>
    </div>

    <div class="gallery">

        <img src="https://picsum.photos/id/10/400/300"
             class="nature"
             onclick="openLightbox(this.src)">

        <img src="https://picsum.photos/id/20/400/300"
             class="nature"
             onclick="openLightbox(this.src)">

        <img src="https://picsum.photos/id/30/400/300"
             class="cars"
             onclick="openLightbox(this.src)">

        <img src="https://picsum.photos/id/40/400/300"
             class="cars"
             onclick="openLightbox(this.src)">

        <img src="https://picsum.photos/id/50/400/300"
             class="nature"
             onclick="openLightbox(this.src)">

        <img src="https://picsum.photos/id/60/400/300"
             class="cars"
             onclick="openLightbox(this.src)">

    </div>

    <div id="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">❮</button>

        <img id="lightbox-img">

        <button class="next" onclick="changeImage(1)">❯</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
